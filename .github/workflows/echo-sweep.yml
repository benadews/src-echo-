name: echo-sweep

on:
  schedule:
    - cron: '5 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: echo-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Supabase key
        run: |
          READ=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/echo_person?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "READ echo_person  -> HTTP $READ"
          WRITE=$(curl -s -o /tmp/w.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/echo_run" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"kind":"keytest"}')
          echo "WRITE echo_run    -> HTTP $WRITE"
          echo "--- response ---"
          head -c 400 /tmp/w.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Locate project
        id: find
        run: |
          DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - run: npm install
        working-directory: ${{ steps.find.outputs.dir }}

      - run: npx tsx src/echo/sweep.ts
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEAMWORK_API_TOKEN: ${{ secrets.TEAMWORK_API_TOKEN }}
          TEAMWORK_BASE_URL: ${{ secrets.TEAMWORK_BASE_URL }}
